<!DOCTYPE html>
<html class="scroll-smooth dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FESTX - QR Scanner Staff View</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,900;1,600;1,900&amp;family=Inter:wght@300;400;600;800&amp;family=Syne:wght@400;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#FF4D00",
                        background: "#0D0D0D",
                        surface: "#1A1A1A",
                    },
                    fontFamily: {
                        display: ["'Playfair Display'", "serif"],
                        sans: ["'Inter'", "sans-serif"],
                        heading: ["'Syne'", "sans-serif"],
                    },
                },
            },
        };
    </script>
<style type="text/tailwindcss">
        :root {
            --primary-color: #FF4D00;
        }
        .material-symbols-outlined {
            font-variation-settings: "FILL" 0, "wght" 300, "GRAD" 0, "opsz" 24
        }
        .stylized-heading {
            font-family: "Playfair Display", serif;
            font-weight: 900;
            letter-spacing: -0.02em
        }
        .metadata-text {
            font-family: "Inter", sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 0.7rem;
            font-weight: 800
        }
        .qr-frame {
            box-shadow: 0 0 40px rgba(255, 77, 0, 0.3), inset 0 0 20px rgba(255, 77, 0, 0.2);
        }
        .viewfinder-bg {
            background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuA6Q-Kn4Ky0RsxhmcQQ5UWvaGcdHbkudeeoOWCt2MytvVcGs1BN_W3GvhyDvtK0qdGWHT8FeW9WTEDvbiVx9eF5q7Qwjf7z3GfqelIoQI2iyQwPb_HXcc79a-K61E8rF8YImEm250vhv3DXyVt3Xm3ks84Q5I0y0rY8N3olZyFBYpqGkP1L1O9IoUTTPDrF1K5U3Vm3nATR0XxPL7eDojfMlLtSA0osc2qmzuoWwHhHSxfLHadmu29IRkfI3-HMF5htyJVc216X2rtA');
            background-size: cover;
            background-position: center;
        }
        .scan-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #FF4D00, transparent);
            animation: scan 3s linear infinite;
        }
        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }
    </style>
</head>
<body class="bg-background text-white font-sans overflow-hidden">
<div class="fixed inset-0 viewfinder-bg -z-20 grayscale opacity-40"></div>
<div class="fixed inset-0 bg-black/70 backdrop-grayscale -z-10"></div>
<nav class="fixed top-0 left-0 right-0 z-50 p-6 flex justify-between items-start">
<div class="flex flex-col gap-1">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-2xl">star</span>
<span class="stylized-heading text-xl italic tracking-tighter">FEST<span class="text-primary">X</span> STAFF</span>
</div>
<span class="metadata-text text-[8px] text-white/40">GATE 04 - MAIN ARENA</span>
</div>
<div class="flex gap-4">
<button class="w-12 h-12 flex items-center justify-center border border-white/20 bg-black/40 hover:bg-primary/20 hover:border-primary transition-all">
<span class="material-symbols-outlined text-white">flashlight_on</span>
</button>
<button class="w-12 h-12 flex items-center justify-center border border-white/20 bg-black/40 hover:bg-primary/20 hover:border-primary transition-all">
<span class="material-symbols-outlined text-white">cached</span>
</button>
</div>
</nav>
<main class="h-screen w-full flex flex-col items-center justify-center px-6">
<div class="relative w-72 h-72 md:w-96 md:h-96">
<div class="absolute -top-1 -left-1 w-12 h-12 border-t-4 border-l-4 border-primary"></div>
<div class="absolute -top-1 -right-1 w-12 h-12 border-t-4 border-r-4 border-primary"></div>
<div class="absolute -bottom-1 -left-1 w-12 h-12 border-b-4 border-l-4 border-primary"></div>
<div class="absolute -bottom-1 -right-1 w-12 h-12 border-b-4 border-r-4 border-primary"></div>
<div class="w-full h-full border border-primary/20 qr-frame overflow-hidden relative">
<div class="scan-line absolute w-full z-10"></div>
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="w-8 h-[1px] bg-primary/40 absolute"></div>
<div class="h-8 w-[1px] bg-primary/40 absolute"></div>
</div>
</div>
</div>
<div class="mt-12 text-center">
<h2 class="text-xl md:text-2xl font-black tracking-[0.15em] mb-2 uppercase">Apunta la cámara al código QR</h2>
<p class="metadata-text text-white/40 text-[10px]">Autodetectar entrada activa</p>
</div>
</main>
<section class="fixed bottom-0 left-0 right-0 z-50">
<div class="bg-black/80 backdrop-blur-2xl border-t border-white/10 px-6 py-8 md:py-10">
<div class="max-w-2xl mx-auto">
<h3 class="metadata-text text-primary mb-6 text-center">Búsqueda Manual</h3>
<div class="flex flex-col md:flex-row gap-4">
<div class="relative flex-grow">
<input class="w-full bg-transparent border-2 border-white/20 px-6 py-4 text-white font-heading uppercase tracking-widest placeholder:text-white/20 focus:border-white focus:ring-0 transition-all outline-none" placeholder="CÓDIGO DE REFERENCIA" type="text"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-white/20">barcode_scanner</span>
</div>
<button class="bg-primary text-white px-10 py-4 metadata-text font-black hover:bg-white hover:text-black transition-all flex items-center justify-center gap-2">
                        VALIDAR
                        <span class="material-symbols-outlined text-sm">verified</span>
</button>
</div>
<div class="flex justify-between items-center mt-6">
<div class="flex gap-4">
<div class="flex flex-col">
<span class="text-[9px] text-white/30 uppercase tracking-tighter">Sesión Activa</span>
<span class="text-[11px] font-bold">STAFF_0912</span>
</div>
<div class="w-[1px] h-8 bg-white/10"></div>
<div class="flex flex-col">
<span class="text-[9px] text-white/30 uppercase tracking-tighter">Validados hoy</span>
<span class="text-[11px] font-bold text-primary">1,248</span>
</div>
</div>
<button class="metadata-text text-[9px] text-white/40 hover:text-white border-b border-white/20 pb-0.5 transition-colors">
                        Historial de escaneo
                    </button>
</div>
</div>
</div>
<div class="h-1 bg-primary w-full opacity-50"></div>
</section>
<div class="fixed top-1/2 left-8 -translate-y-1/2 hidden lg:flex flex-col gap-24 opacity-20">
<span class="[writing-mode:vertical-lr] metadata-text text-[8px] rotate-180">SCANNING_PROTOCOL_ACTIVE</span>
<span class="[writing-mode:vertical-lr] metadata-text text-[8px] rotate-180 text-primary">001.002.003.004</span>
</div>
<div class="fixed top-1/2 right-8 -translate-y-1/2 hidden lg:flex flex-col gap-24 opacity-20">
<span class="[writing-mode:vertical-lr] metadata-text text-[8px]">SECURITY_VERIFIED</span>
<div class="flex flex-col gap-1">
<div class="w-1 h-1 bg-primary"></div>
<div class="w-1 h-1 bg-white"></div>
<div class="w-1 h-1 bg-white"></div>
</div>
</div>

</body></html>
