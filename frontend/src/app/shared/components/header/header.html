<nav class="fixed top-0 left-0 right-0 z-50 bg-background/90 backdrop-blur-xl border-b border-white/10">
  <div class="max-w-[1440px] mx-auto px-6 h-16 flex items-center justify-between">
    <!-- Logo and Navigation -->
    <div class="flex items-center gap-8">
      <!-- Logo -->
      <a [routerLink]="['/']" class="flex items-center gap-2">
        <div class="w-8 h-8 flex items-center justify-center relative">
          <span class="material-symbols-outlined text-primary text-3xl">star</span>
          <div class="absolute inset-0 flex items-center justify-center">
            <div class="w-2 h-2 bg-white rotate-45"></div>
          </div>
        </div>
        <span class="stylized-heading text-2xl tracking-tighter italic">
          Ticket<span class="text-primary">Mastery</span>
        </span>
      </a>
      
      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center gap-6">
        <a
          [routerLink]="['/']"
          class="text-[10px] uppercase font-bold tracking-[0.2em] hover:text-primary transition-colors text-primary"
        >
          Eventos
        </a>
        @if (isAuthenticated() && isBuyer()) {
          <a
            [routerLink]="['/my-tickets']"
            class="text-[10px] uppercase font-bold tracking-[0.2em] hover:text-primary transition-colors text-white/60"
          >
            Mis Tickets
          </a>
        }
      </div>
    </div>

    <!-- Auth Buttons -->
    <div class="flex items-center gap-6">
      @if (!isAuthenticated()) {
        <a
          [routerLink]="['/auth']"
          class="text-[10px] uppercase font-extrabold tracking-[0.2em] text-white border border-white/20 px-5 py-2 hover:bg-white hover:text-black transition-all"
        >
          Login
        </a>
      } @else {
        <div class="flex items-center gap-4">
          <span class="metadata-text text-white/60 hidden md:inline">
            {{ currentUser()?.firstName || 'Usuario' }}
          </span>
          <button
            (click)="logout()"
            class="text-[10px] uppercase font-extrabold tracking-[0.2em] text-white border border-white/20 px-5 py-2 hover:bg-primary hover:border-primary transition-all"
          >
            Salir
          </button>
        </div>
      }
      
      <!-- Mobile Menu Button -->
      <button
        (click)="toggleMobileMenu()"
        class="md:hidden p-2 text-white hover:text-primary transition-colors"
        [attr.aria-label]="mobileMenuOpen() ? 'Cerrar menú' : 'Abrir menú'"
      >
        <span class="material-symbols-outlined">
          {{ mobileMenuOpen() ? 'close' : 'menu' }}
        </span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  @if (mobileMenuOpen()) {
    <app-mobile-menu
      [isAuthenticated]="isAuthenticated()"
      [currentUser]="currentUser()"
      (close)="toggleMobileMenu()"
      (logout)="logout()"
    >
    </app-mobile-menu>
  }
</nav>
