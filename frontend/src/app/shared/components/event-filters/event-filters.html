<div class="space-y-12">
  <!-- Filters Header -->
  <section>
    <h3 class="metadata-text text-primary mb-6 flex items-center gap-2">
      Filters <span class="material-symbols-outlined text-sm">filter_list</span>
    </h3>
    <div class="space-y-4">
      <!-- Category Filters -->
      @for (cat of categories; track cat; let i = $index) {
        <div
          (click)="selectCategory(cat)"
          class="group cursor-pointer flex justify-between items-center py-2 border-b transition-colors"
          [class.border-primary]="selectedCategory === cat"
          [class.border-white/5]="selectedCategory !== cat"
          [class.hover:border-primary]="selectedCategory !== cat"
        >
          <span
            class="metadata-text transition-colors"
            [class.text-primary]="selectedCategory === cat"
            [class.text-white/60]="selectedCategory !== cat"
            [class.group-hover:text-white]="selectedCategory !== cat"
          >
            {{ cat }}
          </span>
          <span
            class="material-symbols-outlined text-xs transition-colors"
            [class.text-primary]="selectedCategory === cat"
            [class.text-white/20]="selectedCategory !== cat"
          >
            north_east
          </span>
        </div>
      }
    </div>
  </section>

  <!-- Price Range -->
  <section>
    <h3 class="metadata-text text-primary mb-6">Price Range</h3>
    <input
      type="range"
      min="0"
      max="500"
      [(ngModel)]="priceMax"
      (ngModelChange)="applyFilters()"
      class="w-full h-1 bg-white/10 appearance-none cursor-pointer accent-primary"
    />
    <div class="flex justify-between mt-4">
      <span class="metadata-text">$0</span>
      <span class="metadata-text">${{ priceMax }}+</span>
    </div>
  </section>

  <!-- Date Range -->
  <section>
    <h3 class="metadata-text text-primary mb-6 text-xs">Date Range</h3>
    <input
      type="date"
      [(ngModel)]="dateFrom"
      (ngModelChange)="applyFilters()"
      class="w-full bg-transparent border border-white/10 px-4 py-3 text-xs uppercase tracking-widest text-white/60 focus:border-primary outline-none"
    />
  </section>

  <!-- Location Search -->
  <section>
    <h3 class="metadata-text text-primary mb-6 text-xs">Location</h3>
    <input
      type="text"
      [(ngModel)]="location"
      (ngModelChange)="applyFilters()"
      placeholder="City or venue..."
      class="w-full bg-transparent border border-white/10 px-4 py-3 text-xs uppercase tracking-widest text-white/60 placeholder:text-white/20 focus:border-primary outline-none"
    />
  </section>

  <!-- Clear Filters -->
  <section>
    <button
      (click)="clearFilters()"
      class="w-full bg-transparent border border-white/20 text-white px-5 py-3 metadata-text text-[10px] hover:bg-primary hover:border-primary transition-all"
    >
      Clear All Filters
    </button>
  </section>
</div>
