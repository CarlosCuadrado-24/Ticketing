@if (show()) {
  <div
    role="alert"
    [attr.aria-live]="type() === 'error' ? 'assertive' : 'polite'"
    class="fixed top-4 right-4 z-[100] animate-slide-in max-w-md"
  >
    <div
      [ngClass]="{
        'bg-green-50 border-green-500 text-green-900': type() === 'success',
        'bg-red-50 border-red-500 text-red-900': type() === 'error',
        'bg-primary/10 border-primary text-primary': type() === 'info',
        'bg-yellow-50 border-yellow-500 text-yellow-900': type() === 'warning',
      }"
      class="flex items-start gap-3 p-4 rounded-lg border-l-4 shadow-lg backdrop-blur-sm bg-background-light/95"
    >
      <!-- Icon -->
      <span
        [ngClass]="{
          'text-green-600': type() === 'success',
          'text-red-600': type() === 'error',
          'text-primary': type() === 'info',
          'text-yellow-600': type() === 'warning',
        }"
        class="material-symbols-outlined text-2xl flex-shrink-0"
      >
        {{ getIcon() }}
      </span>

      <!-- Message -->
      <p class="flex-1 font-semibold text-sm leading-relaxed">{{ message() }}</p>

      <!-- Close Button -->
      <button
        (click)="close()"
        (keydown.enter)="close()"
        (keydown.space)="$event.preventDefault(); close()"
        aria-label="Cerrar notificación"
        class="p-1 hover:bg-black/5 rounded transition-colors"
      >
        <span class="material-symbols-outlined text-gray-500 text-xl">close</span>
      </button>
    </div>
  </div>
}
