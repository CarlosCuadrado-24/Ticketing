<div class="group border border-white/10 hover:border-primary transition-all bg-surface/30">
  <div class="aspect-[4/5] relative overflow-hidden">
    <!-- Event Image -->
    <img
      [src]="getEventImage()"
      [alt]="event.name"
      class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-700"
    />
    
    <!-- Gradient Overlay -->
    <div class="absolute inset-0 bg-gradient-to-t from-background to-transparent opacity-80"></div>
    
    <!-- Live Badge -->
    <div class="absolute top-4 left-4 flex items-center gap-1">
      <span class="material-symbols-outlined text-primary text-sm">star</span>
      <span class="metadata-text text-white">Live</span>
    </div>
    
    <!-- Card Content -->
    <div class="absolute bottom-6 left-6 right-6">
      <!-- Date and Time -->
      <p class="metadata-text text-primary mb-2">
        {{ event.date | date: 'dd MMM / HH:mm' }}
      </p>
      
      <!-- Event Title -->
      <h4 class="stylized-heading text-3xl leading-tight mb-4 line-clamp-2">
        {{ event.name }}
      </h4>
      
      <!-- Location -->
      <div class="flex items-center gap-2 mb-6">
        <span class="material-symbols-outlined text-xs text-white/40">location_on</span>
        <span class="metadata-text text-white/40 truncate">{{ event.location }}</span>
      </div>
      
      <!-- Price and Button -->
      <div class="flex items-center justify-between pt-4 border-t border-white/10">
        <div>
          <span class="metadata-text text-white/40 block mb-1">Desde</span>
          <span class="stylized-heading text-xl text-primary">
            {{ getMinPrice() | currencyFormat }}
          </span>
        </div>
        <a
          [routerLink]="['/event', event.id]"
          class="bg-primary text-white py-3 px-6 metadata-text text-[10px] hover:bg-white hover:text-black transition-all"
        >
          VER EVENTO
        </a>
      </div>
    </div>
  </div>
</div>
