<form class="space-y-10">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
    <div class="space-y-4">
      <label class="block text-xs font-mono font-bold uppercase tracking-widest">First Name</label>
      <input
        id="firstName"
        type="text"
        [(ngModel)]="formData.firstName"
        name="firstName"
        placeholder="JOHN"
        autocomplete="given-name"
        class="w-full bg-black border-2 border-white focus:border-primary focus:ring-0 text-white placeholder:text-zinc-800 p-4 transition-none uppercase font-mono text-sm"
      />
      @if (errors['firstName']) {
        <p class="font-mono text-xs text-red-400 mt-1">{{ errors['firstName'] }}</p>
      }
    </div>

    <div class="space-y-4">
      <label class="block text-xs font-mono font-bold uppercase tracking-widest">Last Name</label>
      <input
        id="lastName"
        type="text"
        [(ngModel)]="formData.lastName"
        name="lastName"
        placeholder="DOE"
        autocomplete="family-name"
        class="w-full bg-black border-2 border-white focus:border-primary focus:ring-0 text-white placeholder:text-zinc-800 p-4 transition-none uppercase font-mono text-sm"
      />
      @if (errors['lastName']) {
        <p class="font-mono text-xs text-red-400 mt-1">{{ errors['lastName'] }}</p>
      }
    </div>

    <div class="space-y-4 md:col-span-2">
      <label class="block text-xs font-mono font-bold uppercase tracking-widest">Email Address</label>
      <input
        id="email"
        type="email"
        [(ngModel)]="formData.email"
        name="email"
        placeholder="JOHN@EXAMPLE.COM"
        autocomplete="email"
        class="w-full bg-black border-2 border-white focus:border-primary focus:ring-0 text-white placeholder:text-zinc-800 p-4 transition-none uppercase font-mono text-sm"
      />
      @if (errors['email']) {
        <p class="font-mono text-xs text-red-400 mt-1">{{ errors['email'] }}</p>
      }
    </div>

    <div class="space-y-4 md:col-span-2">
      <label class="block text-xs font-mono font-bold uppercase tracking-widest">Phone Number</label>
      <input
        id="phone"
        type="tel"
        [(ngModel)]="formData.phone"
        name="phone"
        placeholder="+57 (300) 000-0000"
        autocomplete="tel"
        class="w-full bg-black border-2 border-white focus:border-primary focus:ring-0 text-white placeholder:text-zinc-800 p-4 transition-none uppercase font-mono text-sm"
      />
      @if (errors['phone']) {
        <p class="font-mono text-xs text-red-400 mt-1">{{ errors['phone'] }}</p>
      }
    </div>
  </div>
</form>
