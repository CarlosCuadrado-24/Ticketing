<form class="space-y-6">
  <h3 class="font-heading text-2xl font-bold text-white">Contact Information</h3>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <!-- First Name -->
    <div>
      <label for="firstName" class="block metadata-text text-white/80 mb-2">First Name</label>
      <input
        id="firstName"
        type="text"
        [(ngModel)]="formData.firstName"
        name="firstName"
        placeholder="John"
        autocomplete="given-name"
        class="w-full bg-transparent border border-white/10 px-4 py-3 text-white placeholder:text-white/20 focus:border-primary outline-none"
      />
      @if (errors['firstName']) {
        <p class="metadata-text text-red-400 mt-1">{{ errors['firstName'] }}</p>
      }
    </div>

    <!-- Last Name -->
    <div>
      <label for="lastName" class="block metadata-text text-white/80 mb-2">Last Name</label>
      <input
        id="lastName"
        type="text"
        [(ngModel)]="formData.lastName"
        name="lastName"
        placeholder="Doe"
        autocomplete="family-name"
        class="w-full bg-transparent border border-white/10 px-4 py-3 text-white placeholder:text-white/20 focus:border-primary outline-none"
      />
      @if (errors['lastName']) {
        <p class="metadata-text text-red-400 mt-1">{{ errors['lastName'] }}</p>
      }
    </div>
  </div>

  <!-- Email -->
  <div>
    <label for="email" class="block metadata-text text-white/80 mb-2"
      >Email Address</label
    >
    <input
      id="email"
      type="email"
      [(ngModel)]="formData.email"
      name="email"
      placeholder="john@example.com"
      autocomplete="email"
      class="w-full bg-transparent border border-white/10 px-4 py-3 text-white placeholder:text-white/20 focus:border-primary outline-none"
    />
    @if (errors['email']) {
      <p class="metadata-text text-red-400 mt-1">{{ errors['email'] }}</p>
    }
  </div>

  <!-- Phone -->
  <div>
    <label for="phone" class="block metadata-text text-white/80 mb-2">Phone</label>
    <input
      id="phone"
      type="tel"
      [(ngModel)]="formData.phone"
      name="phone"
      placeholder="+1 (555) 000-0000"
      autocomplete="tel"
      class="w-full bg-transparent border border-white/10 px-4 py-3 text-white placeholder:text-white/20 focus:border-primary outline-none"
    />
    @if (errors['phone']) {
      <p class="metadata-text text-red-400 mt-1">{{ errors['phone'] }}</p>
    }
  </div>
</form>
