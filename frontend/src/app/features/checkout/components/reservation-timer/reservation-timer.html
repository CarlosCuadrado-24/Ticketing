<div
  [class]="
    isExpired
      ? 'bg-red-500/10 border border-red-400/30 p-6'
      : 'bg-primary/10 border border-primary/30 p-6'
  "
>
  <div class="flex items-center gap-4">
    <span
      [class]="
        isExpired
          ? 'material-symbols-outlined text-red-400 text-3xl'
          : 'material-symbols-outlined text-primary text-3xl'
      "
    >
      {{ isExpired ? 'timer_off' : 'schedule' }}
    </span>
    <div>
      @if (isExpired) {
        <p class="font-heading text-base font-bold text-red-400">Reservation Expired!</p>
        <p class="metadata-text text-white/60 mt-1">Your time has run out</p>
      } @else {
        <p class="metadata-text text-white/60">Reservation expires in</p>
        <p class="font-heading text-3xl font-black text-primary mt-1">{{ displayTime }}</p>
      }
    </div>
  </div>
</div>
