<!-- Top Navigation Bar -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-white/10 px-10 py-4 bg-background-dark/80 backdrop-blur-md sticky top-0 z-50">
  <div class="flex items-center gap-4 text-white">
    <div class="size-6 text-primary">
      <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path clip-rule="evenodd" d="M24 4H6V17.3333V30.6667H24V44H42V30.6667V17.3333H24V4Z" fill="currentColor" fill-rule="evenodd"></path>
      </svg>
    </div>
    <h2 class="text-white text-xl font-bold leading-tight tracking-tight">EventOrganizer</h2>
  </div>
  
  <div class="flex flex-1 justify-end gap-8">
    <nav class="flex items-center gap-9">
      @for (item of visibleMenuItems(); track item.path) {
        <a 
          [routerLink]="item.path" 
          routerLinkActive="text-white border-b-2 border-primary pb-1"
          [routerLinkActiveOptions]="{exact: false}"
          class="text-white/70 hover:text-white text-sm font-medium transition-colors"
        >
          {{ item.label }}
        </a>
      }
    </nav>
    
    <button 
      routerLink="/admin/events/create"
      class="flex min-w-[140px] cursor-pointer items-center justify-center rounded-lg h-10 px-5 bg-primary text-white text-sm font-bold tracking-wide hover:bg-primary/90 transition-all shadow-glow-orange"
    >
      <span class="truncate">Create New Event</span>
    </button>
    
    <div 
      class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10 ring-2 ring-white/10 cursor-pointer"
      style="background-image: url('https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=100')"
      (click)="logout()"
      title="Logout"
    ></div>
  </div>
</header>

<!-- Main Content -->
<main class="flex flex-1 justify-center py-10 px-6 lg:px-40 bg-background-dark min-h-screen">
  <div class="layout-content-container flex flex-col max-w-[1200px] flex-1">
    <router-outlet></router-outlet>
  </div>
</main>
