name: CI Pipeline - Ticketing System

on:
  push:
    branches:
      - main
      - develop
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop
      - 'fix/**'

jobs:
  # ============================================
  # FASE 1: VALIDACIÓN DE CÓDIGO
  # ============================================
  code-validation:
    name: 🔍 Validación de Código
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Backend Validation
      - name: 📦 Instalar dependencias Backend
        working-directory: ./backend
        run: npm ci

      - name: 🎨 Formatear código Backend (Prettier)
        working-directory: ./backend
        run: npm run format

      - name: 🔎 Lint Backend (ESLint)
        working-directory: ./backend
        run: npm run lint

      # Frontend Validation
      - name: 📦 Instalar dependencias Frontend
        working-directory: ./frontend
        run: npm ci

      - name: 🎨 Formatear código Frontend (Prettier)
        working-directory: ./frontend
        run: npx prettier --check "src/**/*.{ts,html,css}"

      - name: ✅ Validación completada
        run: echo "✓ Código validado exitosamente (Backend + Frontend)"

  # ============================================
  # FASE 2: TESTS UNITARIOS Y COBERTURA
  # ============================================
  unit-tests:
    name: 🧪 Tests Unitarios Backend
    runs-on: ubuntu-latest
    needs: code-validation
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Instalar dependencias Backend
        working-directory: ./backend
        run: npm ci

      - name: 🧪 Ejecutar tests unitarios Backend
        working-directory: ./backend
        run: npm test -- --coverage

      - name: 📊 Verificar cobertura > 35%
        working-directory: ./backend
        run: |
          echo "Verificando cobertura de código..."
          COVERAGE=$(grep -oP '(?<=All files\s+\|\s+)\d+\.\d+' coverage/lcov-report/index.html | head -1)
          echo "Cobertura actual: $COVERAGE%"
          if (( $(echo "$COVERAGE < 35" | bc -l) )); then
            echo "❌ ERROR: La cobertura ($COVERAGE%) es menor al mínimo requerido (35%)"
            exit 1
          fi
          echo "✅ Cobertura cumple con el mínimo requerido"

      - name: 📈 Mostrar resumen de cobertura
        working-directory: ./backend
        run: |
          echo "======================================"
          echo "RESUMEN DE COBERTURA DE TESTS"
          echo "======================================"
          cat coverage/coverage-summary.json | grep -A 3 "total"
          echo "======================================"

      - name: ✅ Tests completados
        run: echo "✓ Todos los tests unitarios pasaron con cobertura adecuada"

  # ============================================
  # FASE 3: SIMULACIÓN DE DESPLIEGUE
  # ============================================
  deployment-simulation:
    name: 🚀 Simulación de Despliegue
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Backend Build
      - name: 📦 Instalar dependencias Backend
        working-directory: ./backend
        run: npm ci

      - name: 🏗️ Build Backend (Producción)
        working-directory: ./backend
        run: npm run build

      - name: 📝 Verificar artefactos Backend
        working-directory: ./backend
        run: |
          echo "Verificando carpeta dist..."
          ls -la dist/
          echo "✓ Build de backend exitoso"

      # Frontend Build
      - name: 📦 Instalar dependencias Frontend
        working-directory: ./frontend
        run: npm ci

      - name: 🏗️ Build Frontend (Producción)
        working-directory: ./frontend
        run: npm run build

      - name: 📝 Verificar artefactos Frontend
        working-directory: ./frontend
        run: |
          echo "Verificando carpeta dist..."
          ls -la dist/
          echo "✓ Build de frontend exitoso"

      # Docker Build Simulation
      - name: 🐳 Verificar Docker Compose
        run: |
          echo "Validando docker-compose.yml..."
          docker compose config
          echo "✓ Docker Compose válido"

      - name: 🐳 Simular build de imágenes Docker
        run: |
          echo "Construyendo imagen Backend..."
          docker build -t ticketing-backend:test ./backend
          echo "Construyendo imagen Frontend..."
          docker build -t ticketing-frontend:test ./frontend
          echo "✓ Imágenes Docker construidas exitosamente"

      - name: 📦 Listar imágenes creadas
        run: docker images | grep ticketing

      - name: 🧹 Limpiar imágenes
        run: |
          docker rmi ticketing-backend:test ticketing-frontend:test
          echo "✓ Limpieza completada"

      - name: ✅ Despliegue simulado exitoso
        run: |
          echo "================================================"
          echo "✅ PIPELINE COMPLETADO EXITOSAMENTE"
          echo "================================================"
          echo "✓ Validación de código: OK"
          echo "✓ Tests unitarios Backend: OK"
          echo "✓ Cobertura de tests > 35%: OK"
          echo "✓ Build de producción: OK"
          echo "✓ Imágenes Docker: OK"
          echo "================================================"
          echo "🎉 El código está listo para despliegue"

  # ============================================
  # RESUMEN DEL PIPELINE
  # ============================================
  pipeline-summary:
    name: 📋 Resumen del Pipeline
    runs-on: ubuntu-latest
    needs: [code-validation, unit-tests, deployment-simulation]
    if: always()
    
    steps:
      - name: 📊 Estado del Pipeline
        run: |
          echo "======================================"
          echo "RESUMEN DE EJECUCIÓN DEL PIPELINE"
          echo "======================================"
          echo "✓ Validación de código: ${{ needs.code-validation.result }}"
          echo "✓ Tests unitarios Backend: ${{ needs.unit-tests.result }}"
          echo "✓ Simulación de despliegue: ${{ needs.deployment-simulation.result }}"
          echo "======================================"
          if [ "${{ needs.code-validation.result }}" = "success" ] && \
             [ "${{ needs.unit-tests.result }}" = "success" ] && \
             [ "${{ needs.deployment-simulation.result }}" = "success" ]; then
            echo "🎉 PIPELINE EXITOSO - Listo para producción"
          else
            echo "❌ PIPELINE FALLIDO - Revisar logs"
            exit 1
          fi
