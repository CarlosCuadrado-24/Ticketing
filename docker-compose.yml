services:
  # Proxy reverso NGINX con HTTPS
  nginx:
    image: nginx:alpine
    container_name: ticket-nginx
    ports:
      - "0.0.0.0:443:443"
      - "0.0.0.0:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - ticket-network

  postgres:
    image: postgres:15-alpine
    container_name: ticket-db
    environment:
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: ticket_pass
      POSTGRES_DB: ticket_sales
      # Zona horaria de Colombia
      TZ: America/Bogota
      PGTZ: America/Bogota
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Montar zona horaria del host
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - ticket-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_user -d ticket_sales"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: ticket-backend
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ticket_user
      DATABASE_PASSWORD: ticket_pass
      DATABASE_NAME: ticket_sales
      JWT_SECRET: your-secret-key-change-in-production
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: false
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_EXTERNAL_URL: http://127.0.0.1:9001
      # Email Configuration - Gmail SMTP
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_SECURE: false
      SMTP_USER: notificationnoreply90@gmail.com
      SMTP_PASSWORD: rhdpzslvhlgfkhcl
      FROM_NAME: TicketSales
      FROM_EMAIL: noreply@ticketsales.com
      SUPPORT_EMAIL: soporte@ticketsales.com
      COMPANY_NAME: TicketSales
      FRONTEND_URL: http://localhost:4200
      # Email Attachments Configuration
      EMAIL_ATTACH_PDF: true
      EMAIL_ATTACH_PNG: true
      # Mock Payment Gateway Configuration
      MOCK_PAYMENT_SUCCESS_RATE: 1.0
      # Zona horaria de Colombia
      TZ: America/Bogota
    # Puerto interno solamente - NGINX se encargará del tráfico externo
    # ports:
    #   - "0.0.0.0:3000:3000"
    volumes:
      - ./backend/src:/app/src
      # Montar zona horaria del host
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ticket-network
    command: npm run start:dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: ticket-frontend
    environment:
      # Zona horaria de Colombia
      TZ: America/Bogota
    # Puerto interno solamente - NGINX se encargará del tráfico externo 
    # ports:
    #   - "0.0.0.0:4200:4200"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      # Montar zona horaria del host
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - backend
    networks:
      - ticket-network
    command: npm run start -- --host 0.0.0.0 --configuration docker

  test-db:
    image: postgres:15-alpine
    container_name: ticket-test-db
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: ticket_sales_test
    ports:
      - "5433:5432"
    networks:
      - ticket-network
    profiles:
      - test

  # Almacenamiento de imágenes - MinIO (Compatible S3)
  minio:
    image: minio/minio:latest
    container_name: ticketing-storage
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "0.0.0.0:9000:9000"      # API endpoint
      - "0.0.0.0:9001:9001"      # Console Web UI
    volumes:
      - minio_data:/minio_data
    command: server /minio_data --console-address ":9001"
    networks:
      - ticket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # pgAdmin para administración de la base de datos
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ticket-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ticketapp.com
      PGADMIN_DEFAULT_PASSWORD: Admin123!
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "0.0.0.0:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - ticket-network
    depends_on:
      - postgres

  # Servicio alternativo: Servidor de archivos simple con Node.js
  file-server:
    build:
      context: ./file-server
      dockerfile: Dockerfile
    container_name: ticketing-file-server
    environment:
      NODE_ENV: production
      PORT: 3001
      UPLOAD_DIR: /uploads
    ports:
      - "0.0.0.0:3001:3001"
    volumes:
      - file_uploads:/uploads
      - ./file-server/server.js:/app/server.js
    networks:
      - ticket-network
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  ticket-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  file_uploads:
  pgadmin_data:
